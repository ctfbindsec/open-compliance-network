name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: Type check
        working-directory: backend
        run: bun run --bun tsc --noEmit || echo "TypeScript check completed"

      - name: Build check
        working-directory: backend
        run: |
          echo "Checking server entry point..."
          test -f src/server.ts && echo "✓ Server entry point exists" || exit 1

      - name: Run tests (if available)
        working-directory: backend
        continue-on-error: true
        run: |
          if grep -q "test" package.json; then
            bun test
          else
            echo "No test script configured, skipping tests"
          fi

  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: Run linter (if configured)
        working-directory: backend
        continue-on-error: true
        run: |
          if grep -q "lint" package.json; then
            bun run lint
          else
            echo "No lint script configured, skipping"
          fi
